name: Generate Android Release Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Mot de passe du Keystore (store password)'
        required: true
        type: string
      key_password:
        description: 'Mot de passe de la Clé (key password)'
        required: true
        type: string

jobs:
  generate:
    name: Generate Keystore & Base64
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate Keystore file
        env:
          KEYSTORE_PWD: ${{ github.event.inputs.keystore_password }}
          KEY_PWD: ${{ github.event.inputs.key_password }}
        run: |
          # Masquer les mots de passe des logs de manière proactive
          echo "::add-mask::$KEYSTORE_PWD"
          echo "::add-mask::$KEY_PWD"

          # Créer un dossier isolé en dehors de l'arborescence git
          mkdir -p "$RUNNER_TEMP/keystore_output"

          # Génération du Keystore RSA 2048, validité 10000 jours avec CN=QuincaStock, O=ADN Studio Numerique
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/keystore_output/quincastock-release.keystore" \
            -alias "quincastock" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PWD" \
            -keypass "$KEY_PWD" \
            -dname "CN=QuincaStock, O=ADN Studio Numerique"

          # Encodage en Base64 sur une seule ligne propre
          base64 -w 0 "$RUNNER_TEMP/keystore_output/quincastock-release.keystore" > "$RUNNER_TEMP/keystore_output/keystore-base64.txt"

          # Fichier d'instructions d'aide pour la configuration des secrets
          cat << 'EOF' > "$RUNNER_TEMP/keystore_output/INSTRUCTIONS_SECRETS.txt"
          QUINCASTOCK - GUIDE DE CONFIGURATION DES SECRETS GITHUB
          =======================================================
          1. Ouvrez le fichier 'keystore-base64.txt' et copiez son contenu intégral.
          2. Rendez-vous dans votre dépôt GitHub :
             Settings > Secrets and variables > Actions > New repository secret
          3. Créez les 4 secrets suivants :
             - KEYSTORE_BASE64   : [Collez la chaîne complète du fichier keystore-base64.txt]
             - KEYSTORE_PASSWORD : [Le mot de passe du Keystore saisi lors du lancement]
             - KEY_ALIAS         : quincastock
             - KEY_PASSWORD      : [Le mot de passe de la Clé saisi lors du lancement]

          IMPORTANT : Conservez également le fichier quincastock-release.keystore dans un endroit sûr (ex: Google Drive).
          EOF

      - name: Upload Keystore Artifact (Expiring in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: quincastock-keystore-bundle
          path: |
            ${{ runner.temp }}/keystore_output/quincastock-release.keystore
            ${{ runner.temp }}/keystore_output/keystore-base64.txt
            ${{ runner.temp }}/keystore_output/INSTRUCTIONS_SECRETS.txt
          retention-days: 1
